<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title description">
  <title id="title">Test-case migration set relationships</title>
  <desc id="description">Ground truth lies inside both the official-test and spec regions. The spec-only region is definitely problematic.</desc>

  <rect width="760" height="340" fill="#ffffff"/>

  <ellipse cx="290" cy="170" rx="230" ry="135" fill="#3b82f6" fill-opacity="0.20" stroke="#2563eb" stroke-width="3"/>
  <ellipse cx="470" cy="170" rx="230" ry="135" fill="#f59e0b" fill-opacity="0.22" stroke="#d97706" stroke-width="3"/>

  <text x="185" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">
    Official tests
  </text>
  <text x="575" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#b45309">
    Specification
  </text>

  <ellipse cx="380" cy="185" rx="80" ry="48" fill="#22c55e" fill-opacity="0.75" stroke="#15803d" stroke-width="3"/>
  <text x="380" y="191" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">
    ground truth
  </text>

  <rect x="540" y="172" width="120" height="60" rx="9" fill="#fee2e2" fill-opacity="0.88" stroke="#c98b8b" stroke-width="2"/>
  <text x="600" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#7f1d1d">
    Official tests reject
  </text>
  <text x="600" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#7f1d1d">
    Specification accepts?
  </text>
</svg>
